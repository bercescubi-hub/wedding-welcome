<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Welcome</title>
<meta name="theme-color" content="#160b18">
<meta name="description" content="Ecranul de bun venit pentru invitați: mesajul mirilor, găsirea mesei și photo booth.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontcss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Josefin+Sans:wght@300..600&family=Jost:wght@300..600&family=Marcellus&family=Montserrat:wght@300..600&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Raleway:wght@300..600&display=swap">
<style>
/* Layout: administrare = o coloană calmă cu bară de acțiuni fixă jos; ecranul invitaților = scenă pe toată suprafața, temă aleasă de miri */
:root{
  --bg:#f5f2f5; --surface:#ffffff; --surface-2:#faf7fa; --ink:#26182a; --muted:#6e6272; --line:#e4dce6;
  --accent:#6a2a5e; --accent-ink:#ffffff; --gold:#8f6f35; --ok:#2f7a4f; --warn:#9a5118; --danger:#a3283a;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:14px; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#130e15; --surface:#1d1620; --surface-2:#231b26; --ink:#f1eaf2; --muted:#a99eac; --line:#362c39;
  --accent:#d498c4; --accent-ink:#1d0f1b; --gold:#d8b87d; --ok:#6cc391; --warn:#e3a066; --danger:#f0798a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#130e15; --surface:#1d1620; --surface-2:#231b26; --ink:#f1eaf2; --muted:#a99eac; --line:#362c39;
  --accent:#d498c4; --accent-ink:#1d0f1b; --gold:#d8b87d; --ok:#6cc391; --warn:#e3a066; --danger:#f0798a; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

/* ---------- AUTH ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(120% 70% at 50% -5%,#2b1531 0%,#160b18 62%),#160b18;color:#f0e3cb}
.acard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.acard .brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
.acard .brand .w{width:62px;height:62px;border-radius:50%;border:1px solid rgba(207,174,114,.6);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:1.7rem;color:#f0e3cb}
.acard h1{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:2rem}
.acard .sub{color:rgba(240,227,203,.66);font-size:.92rem;text-align:center}
.acard label{font-size:.82rem;color:rgba(240,227,203,.7);display:block;margin-bottom:6px}
.acard .ai{width:100%;background:rgba(240,227,203,.06);border:1px solid rgba(207,174,114,.35);border-radius:10px;padding:12px 13px;color:#f0e3cb;font-size:16px}
.acard .ai:focus{outline:2px solid #cfae72;outline-offset:1px}
.acard .go{background:#f0e3cb;color:#160b18;border:0;border-radius:99px;padding:14px;font-weight:600;letter-spacing:.08em;margin-top:4px}
.acard .lnk{background:none;border:0;color:rgba(240,227,203,.75);text-decoration:underline;text-underline-offset:3px;font-size:.9rem;padding:6px}
.acard .links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.acard .err{color:#f3a3b0;font-size:.9rem;min-height:1.3em;text-align:center}
.acard .fine{font-size:.8rem;color:rgba(240,227,203,.5);text-align:center}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.5rem;letter-spacing:.12em;text-align:center;padding:16px;border:1px dashed #cfae72;border-radius:12px;color:#f0e3cb;user-select:all}

/* ---------- ADMIN ---------- */
.admin{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.crumb{border:0;background:none;color:var(--muted);padding:0 0 6px;font-size:.88rem}
.crumb:hover{color:var(--ink)}
.eyebrow-a{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500}
.top h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state-pill{font-size:.75rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:none}
button.state-pill{color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.no{background:var(--warn)}
.draft{border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface)}
.draft.dirty{border-color:var(--gold);background:var(--surface-2)}
.draft p{font-size:.92rem}
.draft b{font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:.92rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:1.05rem;font-weight:600}
.hint{font-size:.88rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.82rem;color:var(--muted);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;font-size:16px;min-width:0}
textarea.inp{min-height:110px;resize:vertical;font-size:15px}
select.inp{padding:9px 10px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.sw-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.sw-row:first-of-type{border-top:0;padding-top:0}
.sw-row .txt{flex:1;min-width:0}
.sw-row b{display:block;font-weight:600}
.sw-row span{font-size:.86rem;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(22px)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500;font-size:.95rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:.85rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:.86rem;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line);color:var(--muted)}
.ok-msg{color:var(--ok)} .err-msg{color:var(--danger)}
.cat{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.cat-head{display:flex;gap:8px;align-items:center}
.cat-head .inp{font-weight:600}
.status{font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.status.ok{color:var(--ok)} .status.sim{color:var(--warn)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
.glist{display:flex;flex-direction:column}
.g{display:grid;grid-template-columns:1fr 92px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.g .nm{min-width:0;overflow-wrap:anywhere}
.tb-in{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tb-in:hover,.tb-in:focus{border-color:var(--line);background:var(--surface-2)}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 8px}
.add-g{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:end}
@media (max-width:600px){.add-g{grid-template-columns:1fr 90px}.add-g .btn{grid-column:1/-1}}
.imp{display:flex;flex-direction:column;gap:12px;border:1px solid var(--gold);border-radius:12px;padding:14px;background:var(--surface-2)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl td,.tbl th{padding:7px 8px;border-top:1px solid var(--line);text-align:left}
.tbl th{font-weight:600;color:var(--muted);font-size:.8rem;border-top:0}
.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl select{width:100%}
.radio{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.radio input{margin-top:4px}
.preview-wrap{border-radius:22px;overflow:hidden;border:1px solid var(--line);max-width:420px;width:100%;margin:0 auto}
.preview{padding:28px 18px 30px;min-height:520px}
.limits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.limits{grid-template-columns:1fr}}
.limits ul{margin:6px 0 0;padding-left:18px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.limits h3{font-size:.9rem;font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:8px;text-align:left}
.tcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tsw{height:92px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tsw i{font-family:"Bodoni Moda",Georgia,serif;font-size:1.3rem}
.tsw em{display:block;width:34px;height:2px;border-radius:2px}
.tcard b{font-size:.92rem;font-weight:600;padding:0 4px}
.tcard small{font-size:.78rem;color:var(--muted);padding:0 4px 4px;line-height:1.3}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fcard{border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.fcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.fcard .fn{font-size:1.7rem;line-height:1.15}
.fcard .fd{font-size:1.05rem}
.fcard .fb{font-size:.88rem}
.fcard small{font-size:.76rem;color:var(--muted);margin-top:4px}
.bgrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bgthumb{width:120px;height:80px;border-radius:10px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2)}
.range{width:100%;accent-color:var(--accent)}
.split{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.split .preview-wrap{position:sticky;top:16px}
.split .preview{min-height:560px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.actionbar button{flex:1;padding:15px 10px;border-radius:12px;font-weight:600;letter-spacing:.06em;font-size:.92rem}
.b-test{border:1.5px solid var(--ink);background:transparent}
.b-live{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(10,5,12,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:rise .25s ease}
.sheet h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.6rem}
.sum{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:.93rem}
.sum div:first-child{border-top:0}
.chg{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.on{color:var(--ok);font-weight:600} .off{color:var(--muted)}

/* ---------- STAGE (ecranul invitaților; culorile și fonturile vin din temă) ---------- */
.stagebg{
  --stage:#160b18; --stage-2:#2b1531; --champ:#f0e3cb; --champ-dim:rgba(240,227,203,.64); --gilt:#cfae72; --gilt-line:rgba(207,174,114,.42);
  --card:rgba(240,227,203,.04); --card-h:rgba(240,227,203,.09); --err:#f3a3b0;
  --s-names:"Bodoni Moda",Georgia,serif; --s-display:"Bodoni Moda",Georgia,serif; --s-body:"Jost",system-ui,sans-serif;
  --names-style:italic; --d-style:italic; --names-scale:1;
  background:radial-gradient(120% 70% at 50% -5%,var(--stage-2) 0%,var(--stage) 62%),var(--stage);color:var(--champ);font-family:var(--s-body)}
.stage{position:fixed;inset:0;z-index:30;overflow-y:auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left,0px))}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.mono{width:46px;height:46px;border-radius:50%;border:1px solid var(--gilt-line);background:transparent;color:var(--gilt);font-family:var(--s-display);font-style:var(--d-style);font-size:.95rem;position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.mono svg{position:absolute;inset:-3px;width:52px;height:52px;transform:rotate(-90deg);pointer-events:none}
.mono circle{fill:none;stroke:var(--champ);stroke-width:2;stroke-dasharray:157;stroke-dashoffset:157}
.mono.holding circle{transition:stroke-dashoffset 3s linear;stroke-dashoffset:0}
.test-tag{font-size:.7rem;letter-spacing:.2em;border:1px solid var(--gilt);color:var(--gilt);padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--stage) 70%,transparent)}
.ghost{border:1px solid var(--gilt-line);background:color-mix(in srgb,var(--stage) 70%,transparent);color:var(--champ);border-radius:99px;padding:8px 14px;font-size:.85rem}
.sbody{flex:1;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.home{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4vh}
.eyebrow{font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gilt)}
.names{font-family:var(--s-names);font-style:var(--names-style);font-weight:400;font-size:calc(clamp(2.5rem,11vw,4.6rem) * var(--names-scale));line-height:1.02;letter-spacing:-.01em}
.names .amp{display:block;font-size:.5em;color:var(--gilt);margin:.12em 0}
.orn{display:flex;align-items:center;gap:10px;width:160px;margin:6px 0}
.orn span{flex:1;height:1px;background:var(--gilt-line)}
.orn i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gilt)}
.evname{font-size:1.02rem;letter-spacing:.02em}
.evmeta{font-size:.86rem;color:var(--champ-dim)}
.mods{display:grid;gap:12px;width:100%;margin-top:26px}
.mod{display:grid;grid-template-columns:50px 1fr 16px;gap:14px;align-items:center;text-align:left;min-height:88px;padding:18px 18px;border-radius:18px;
  border:1px solid var(--gilt-line);background:var(--card);color:var(--champ);transition:background .2s,transform .15s;font-family:var(--s-body)}
.mod:active{transform:scale(.985);background:var(--card-h)}
@media (hover:hover){.mod:hover{background:var(--card-h)}}
.mod .ic{width:50px;height:50px;border-radius:50%;border:1px solid var(--gilt-line);display:grid;place-items:center;color:var(--gilt)}
.mod .ic svg{width:22px;height:22px}
.mod b{display:block;font-family:var(--s-display);font-weight:500;font-size:1.38rem;line-height:1.15;color:var(--champ)}
.mod span{font-size:.86rem;color:var(--champ-dim)}
.mod .chev{color:var(--gilt);font-size:1.3rem}
@media (min-width:900px){.sbody.wide{max-width:1000px}.mods{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.preview .mods{grid-template-columns:1fr}
.empty{color:var(--champ-dim);font-size:.95rem;padding:18px;border:1px dashed var(--gilt-line);border-radius:14px}
.back{align-self:flex-start;border:0;background:none;color:var(--champ-dim);padding:8px 0;font-size:.95rem;margin-bottom:8px;font-family:var(--s-body)}
.sh2{font-family:var(--s-display);font-style:var(--d-style);font-weight:400;font-size:clamp(2rem,8vw,2.8rem);line-height:1.1}
.ssub{color:var(--champ-dim);margin-top:6px;margin-bottom:22px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catb{min-height:120px;border-radius:18px;border:1px solid var(--gilt-line);background:var(--card);color:var(--champ);padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-family:var(--s-body)}
.catb:active{transform:scale(.98)}
@media (hover:hover){.catb:hover{background:var(--card-h)}}
.catb b{font-family:var(--s-display);font-weight:500;font-size:1.35rem;line-height:1.15}
.catb span{font-size:.78rem;color:var(--gilt);letter-spacing:.12em;text-transform:uppercase}
.player{display:flex;flex-direction:column;gap:16px}
.player video{width:100%;max-height:70vh;border-radius:16px;background:#000}
.verr{font-size:.92rem;color:var(--err)}
.sim{border-radius:18px;border:1px solid var(--gilt-line);aspect-ratio:9/12;max-width:100%;max-height:64vh;width:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;

/* ---------------- IndexedDB (videoclipuri, fundaluri) ---------------- */
const IDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ try { const r = indexedDB.open('wedding-welcome', 2);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('videos')) d.createObjectStore('videos'); if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e) { rej(e); } }); },
  async run(store, mode, fn){ if (!this.db) this.db = await this.open();
    return new Promise((res,rej) => { const tx = this.db.transaction(store, mode); const req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); },
  get(st,k){ return this.run(st,'readonly', s => s.get(k)); },
  put(st,k,v){ return this.run(st,'readwrite', s => s.put(v,k)); },
  del(st,k){ return this.run(st,'readwrite', s => s.delete(k)); },
  keys(st){ return this.run(st,'readonly', s => s.getAllKeys()); }
};
const urls = {};
const bkey = id => USER.id + '/' + id;
async function blobURL(id){
  if (!id) return null; if (urls[id]) return urls[id];
  try { const b = await IDB.get('blobs', bkey(id)); if (b) { urls[id] = URL.createObjectURL(b); return urls[id]; } } catch(e) {}
  return null;
}
async function putBlob(file, prefix){
  const id = prefix + '-' + uid8();
  await IDB.put('blobs', bkey(id), file);

}

}

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function hashPw(pass, salt){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:unb64(salt), iterations:150000 }, key, 256));
}
const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
function recoveryCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = crypto.getRandomValues(new Uint8Array(12));
  return Array.from(r, b => A[b % A.length]).join('').replace(/(.{4})(?!$)/g, '$1-');
}
const accounts = () => LS.get(K_ACC) || { users: [] };
const findUser = name => accounts().users.find(u => u.username.toLowerCase() === String(name).trim().toLowerCase());
async function createUser(username, password){
  username = String(username).trim();
  if (username.length < 3) throw 'Numele de utilizator trebuie să aibă cel puțin 3 caractere.';
  if (!/^[\p{L}\p{N}._-]+$/u.test(username)) throw 'Folosește doar litere, cifre, punct, minus sau „_”, fără spații.';
  if (findUser(username)) throw 'Există deja un cont cu acest nume.';
  if (String(password).length < 6) throw 'Parola trebuie să aibă cel puțin 6 caractere.';
  const salt = newSalt(), rsalt = newSalt(), code = recoveryCode();
  const u = { id: 'u' + uid8(), username, salt, hash: await hashPw(password, salt), rsalt, rhash: await hashPw(code.replace(/-/g,''), rsalt), created: new Date().toISOString(), updated: new Date().toISOString() };
  const acc = accounts(); const first = !acc.users.length; acc.users.push(u); LS.set(K_ACC, acc);
  // spațiul de lucru nou
  let draft = cfgFromData(DATA || FALLBACK_DATA);
  let ws = { draft, published:null, publishedAt:null, live:false, keptPhotos:0, dataVersion:(DATA||FALLBACK_DATA).version||0 };
  if (first) ws = await migrateOld(u, ws);
  LS.set(wsKey(u.id), ws);
  return { user:u, code };
}
async function migrateOld(u, ws){
  const old = LS.get(K_OLD);
  if (!old || !Array.isArray(old.guests)) return ws;
  const c = normCfg(old);
  for (const cat of c.categories){
    const v = (old.categories.find(x => x.id === cat.id) || {}).video;
    cat.video = null;
    if (v) { try { const b = await IDB.get('videos', cat.id); if (b) { const id = 'v-' + uid8(); await IDB.put('blobs', u.id + '/' + id, b); cat.video = { blob:id, name:v.name, size:v.size }; } } catch(e) {} }
  }
  LS.del(K_OLD);
  return Object.assign(ws, { draft:c, dataVersion: old.dataVersion || ws.dataVersion, keptPhotos: old.keptPhotos || 0 });
}
async function checkPw(u, pw){ return (await hashPw(pw, u.salt)) === u.hash; }
function updateUser(u){ u.updated = new Date().toISOString(); const acc = accounts(); acc.users = acc.users.map(x => x.id === u.id ? u : x); LS.set(K_ACC, acc); }

/* ---------------- Conturi în Google Sheet ----------------
   Pe un dispozitiv nou, contul nu e în browser: îl căutăm prin scriptul Google (foaia „Conturi”).
   Parola nu pleacă niciodată: scriptul dă sarea, aplicația calculează amprenta și o trimite spre comparare. */
const scriptUrl = () => (window.WW_CONFIG || {}).scriptUrl || '';
async function cloud(payload){
  const url = scriptUrl(); if (!url) throw new Error('fără script');
  return window.WWNet.call(url, payload, payload.action === 'recover');
}
/** Salvează pe acest dispozitiv contul venit din Google Sheet și conectează Evenimentele cu cheia primită. */
function adoptCloudUser(cu, token, role){
  const acc = accounts();
  const rec = { id:cu.id, username:cu.username, salt:cu.salt, hash:cu.hash, rsalt:cu.rsalt, rhash:cu.rhash, created:cu.created, updated:cu.updated };
  acc.users = acc.users.filter(x => x.id !== rec.id && x.username.toLowerCase() !== rec.username.toLowerCase()).concat(rec);
  LS.set(K_ACC, acc);
  const ck = 'ww-crm-' + rec.id, crm = LS.get(ck) || {};
  if (token) { crm.url = scriptUrl(); crm.token = token; crm.role = role || 'user'; delete crm.key; LS.set(ck, crm); }
  return rec;
}
async function cloudLogin(username, password){
  const s = await cloud({ action:'authSalt', username });
  if (!s || !s.ok) throw new Error((s && s.error) || 'Google nu a răspuns.');
  const r = await cloud({ action:'login', username, hash: await hashPw(password, s.salt) });
  if (!r.ok) throw r.error || 'Utilizator sau parolă greșite.';
  return adoptCloudUser(r.user, r.token, r.role);
}
async function cloudRecover(username, code, password){
  const s = await cloud({ action:'authSalt', username });
  if (!s || !s.ok) throw new Error('Google nu a răspuns.');
  const salt = newSalt();
  const r = await cloud({ action:'recover', username, rhash: await hashPw(code, s.rsalt), salt, hash: await hashPw(password, salt) });
  if (!r.ok) throw r.error || 'Utilizatorul sau codul de recuperare nu se potrivesc.';
  return adoptCloudUser(r.user, r.token, r.role);
}

function modNote(c){
  const after = afterMods(c).map(k => MODS[k].title);

  if (c.modules.welcome) return 'Flux: invitatul vede întâi „Ciocnește cu mirii” și mesajul video. ' +
    (after.length ? `După mesaj apar: ${after.join(' și ')}.` : 'După mesaj, ecranul revine la început pentru următorul invitat.');
  return `Fără mesaj de bun venit, invitații văd direct: ${after.join(' și ')}.`;
}

const VID_EXT = /\.(mp4|m4v|mov|webm|mkv|avi|ogv)$/i;
const fileBase = n => n.replace(/^.*[\\/]/, '').replace(/\.[^.]+$/, '');
const tokenize = s => norm(s).replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();
const titleCase = s => s.replace(/(^|\s)\p{L}/gu, m => m.toUpperCase());
function matchCategory(fname, cats){
  const b = tokenize(fileBase(fname)); if (!b) return null;
  const C = cats.map(c => ({ c, n: tokenize(c.name), i: tokenize(c.id) }));
  const tests = [x => b === x.n || b === x.i, x => b.startsWith(x.n) || x.n.startsWith(b), x => (x.n.length > 2 && b.includes(x.n)) || (b.length > 2 && x.n.includes(b)) || (x.i.length > 2 && b.includes(x.i))];
  for (const t of tests) { const hit = C.find(t); if (hit) return hit.c.id; }
  return null;
}
function buildVideoImport(fileList){
  const files = Array.from(fileList).filter(f => !/^\./.test(f.name) && (VID_EXT.test(f.name) || (f.type || '').startsWith('video/')));
  const skipped = Array.from(fileList).length - files.length;
  const used = new Set();
  files.sort((a,b) => a.name.localeCompare(b.name, 'ro', {numeric:true}));
  const rows = files.map(f => {
    let target = matchCategory(f.name, W.draft.categories), note = '';
    if (target && used.has(target)) { note = 'Altă filmare e deja aleasă pentru această categorie.'; target = 'skip'; }
    else if (target) used.add(target);
    else target = 'new';
    return { file:f, target, note, newName: titleCase(tokenize(fileBase(f.name))) || 'Categorie nouă' };
  });
  vImport = { rows, skipped, busy:false, done:'' };
}

async function runVideoImport(){
  const rows = vImport.rows.filter(r => r.target !== 'skip'); let n = 0;
  for (const r of rows) {
    vImport.busy = `Se încarcă ${++n} din ${rows.length}…`; renderAdmin();
    let cat;
    if (r.target === 'new') {
      cat = W.draft.categories.find(x => norm(x.name) === norm(r.newName));
      if (!cat) { cat = { id:'c'+uid8(), name:r.newName, msg:'Ne bucurăm mult că sunteți aici!', video:null }; W.draft.categories.push(cat); }
    } else cat = W.draft.categories.find(x => x.id === r.target);
    if (!cat) continue;
    try { const id = await putBlob(r.file, 'v'); cat.video = { blob:id, name:r.file.name, size:r.file.size }; }
    catch(e) { msgs.vid = 'Nu am putut salva ' + r.file.name + '. Spațiul de pe laptop poate fi plin.'; }
    saveW();
  }
  vImport = null; if (!msgs.vid) msgs.vid = `${rows.length} ${rows.length===1?'videoclip încărcat':'videoclipuri încărcate'}. Verifică-le cu „Testează”.`;
  await gc(); renderAdmin();
}

/* ----- citire Excel (.xlsx) fără biblioteci externe, ca să meargă offline ----- */
async function unzip(buf){
  const dv = new DataView(buf); let e = buf.byteLength - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('nu e zip');
  const count = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const files = {};
  for (let i = 0; i < count; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    files[new TextDecoder().decode(new Uint8Array(buf, p + 46, nl))] = { method, csize, off };
    p += 46 + nl + xl + cl;
  }
  return { async text(name){
    const f = files[name]; if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = new Uint8Array(buf, start, f.csize);
    const out = f.method === 0 ? data : new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    return new TextDecoder().decode(out);
  } };
}
async function readXlsx(buf){
  const z = await unzip(buf); const X = s => new DOMParser().parseFromString(s, 'application/xml');
  const T = (el, tag) => Array.from(el.getElementsByTagNameNS('*', tag));
  const ss = []; const sst = await z.text('xl/sharedStrings.xml');
  if (sst) for (const si of T(X(sst), 'si')) ss.push(T(si, 't').filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join(''));
  let path = 'xl/worksheets/sheet1.xml';
  const wb = await z.text('xl/workbook.xml'), rels = await z.text('xl/_rels/workbook.xml.rels');
  if (wb && rels) {
    const sh = T(X(wb), 'sheet')[0];
    const rid = sh && (sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || sh.getAttribute('r:id'));
    const rel = T(X(rels), 'Relationship').find(r => r.getAttribute('Id') === rid);
    if (rel) { const t = rel.getAttribute('Target'); path = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, ''); }
  }
  const sx = await z.text(path); if (!sx) throw new Error('fără foaie');
  const rows = [];
  for (const row of T(X(sx), 'row')) {
    const rn = +row.getAttribute('r'); while (rn && rows.length < rn - 1) rows.push([]);   // păstrează numerotarea rândurilor din Excel
    const arr = []; let auto = 0;
    for (const cell of T(row, 'c')) {
      const ref = cell.getAttribute('r'); let col = auto;
      if (ref) { col = 0; for (const ch of ref.replace(/[0-9$]/g, '')) col = col * 26 + (ch.charCodeAt(0) - 64); col--; }
      auto = col + 1;
      const t = cell.getAttribute('t'); const v = T(cell, 'v')[0];
      arr[col] = t === 's' ? (ss[+(v && v.textContent)] ?? '') : t === 'inlineStr' ? T(cell, 't').map(x => x.textContent).join('') : (v ? v.textContent : '');
    }
    rows.push(Array.from(arr, x => x ?? ''));
  }
  return rows;
}

async function handleGuestFile(file){

    if (/\.(csv|txt)$/i.test(file.name) || file.type === 'text/csv') rows = readCsv(await file.text());

  const out = [];

  if (det.length) out.push('Detalii eveniment: ' + det.map(k => ({couple:'numele mirilor', eventName:'numele evenimentului', date:'data', venue:'locația'})[k]).join(', '));
  Object.keys(MODS).forEach(k => { if (!!a.modules[k] !== !!b.modules[k]) out.push(`${MODS[k].admin}: ${b.modules[k] ? 'activat' : 'ascuns'}`); });
  if (a.pin !== b.pin) out.push('PIN-ul de ieșire din LIVE');
  if (a.theme.id !== b.theme.id) out.push(`Tema: ${themeOf(b).name}`);
  if (a.theme.font !== b.theme.font) out.push(`Scrisul: ${fontOf(b).name}`);
  if (JSON.stringify(a.theme.bg) !== JSON.stringify(b.theme.bg) || (b.theme.bg && a.theme.overlay !== b.theme.overlay)) out.push(b.theme.bg ? 'Poza de fundal' : 'Poza de fundal eliminată');
  const ca = new Map(a.categories.map(x => [x.id, x]));
  b.categories.forEach(x => { const o = ca.get(x.id);
    if (!o) out.push(`Categorie nouă: ${x.name}${x.video ? ' (cu video)' : ''}`);
    else { const d = [];
      if (o.name !== x.name) d.push(`redenumită din „${o.name}”`);
      if (JSON.stringify(o.video) !== JSON.stringify(x.video)) d.push(x.video ? (o.video ? 'video înlocuit' : 'video adăugat') : 'video eliminat');
      if (o.msg !== x.msg) d.push('mesaj schimbat');
      if (d.length) out.push(`${x.name}: ${d.join(', ')}`); } });
  a.categories.forEach(x => { if (!b.categories.find(y => y.id === x.id)) out.push(`Categorie ștearsă: ${x.name}`); });
  const ga = new Map(a.guests.map(g => [norm(g.name), g])), gb = new Map(b.guests.map(g => [norm(g.name), g]));
  let add = 0, del = 0, mv = 0;
  gb.forEach((g,k) => { const o = ga.get(k); if (!o) add++; else if (String(o.table) !== String(g.table)) mv++; });
  ga.forEach((g,k) => { if (!gb.has(k)) del++; });
  if (add || del || mv) out.push('Invitați: ' + [add && `${add} adăugați`, del && `${del} șterși`, mv && `${mv} mutați la altă masă`].filter(Boolean).join(', '));
  return out;
}

async function setBackground(file){
  msgs.bg = 'Se pregătește poza…'; renderAdmin();
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2560 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .88));
    const id = await putBlob(blob, 'bg');
    W.draft.theme.bg = { blob:id, name:file.name }; saveW(); msgs.bg = ''; await gc();
  } catch(e) { msgs.bg = 'Nu am putut folosi această imagine. Încearcă un JPG sau PNG.'; }
  renderAdmin(); paintBgThumb();
}

document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  try {
    if (f.id === 'fSignup') {
      const u = $('#su-u').value, p = $('#su-p').value, p2 = $('#su-p2').value;
      if (p !== p2) throw 'Parolele nu coincid.';
      const r = await createUser(u, p); authErr = ''; authInfo = { username:r.user.username, code:r.code }; authView = 'code'; renderAuth();
    } else if (f.id === 'fLogin') {
      const name = $('#li-u').value.trim(), pw = $('#li-p').value, u = findUser(name);
      if (u && await checkPw(u, pw)) { authErr = ''; login(u); return; }
      // nu e pe acest dispozitiv (sau parola s-a schimbat pe altul): întrebăm Google Sheet
      if (scriptUrl() && navigator.onLine) {
        const box = $('#auth .err'); if (box) box.textContent = 'Caut contul…';
        try { const cu = await cloudLogin(name, pw); authErr = ''; login(cu); return; }
        catch (e) {
          if (typeof e === 'string') throw e;
          if (u) throw 'Parola nu e corectă.';   // contul e pe acest dispozitiv: nu-l mai căutăm la Google
          throw 'Nu am putut verifica contul la Google. Verifică internetul și încearcă din nou. (' + String(e && e.message || e).slice(0, 140) + ')';
        }
      }
      throw u ? 'Parola nu e corectă.' : (navigator.onLine ? 'Utilizator sau parolă greșite.' : 'Contul nu e pe acest dispozitiv, iar fără internet nu-l pot căuta.');
    } else if (f.id === 'fRecover') {
      const name = $('#rc-u').value.trim(), u = findUser(name); const code = $('#rc-c').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); const p = $('#rc-p').value;
      if (p.length < 6) throw 'Parola nouă trebuie să aibă cel puțin 6 caractere.';
      if (u && (await hashPw(code, u.rsalt)) === u.rhash) {
        u.salt = newSalt(); u.hash = await hashPw(p, u.salt); updateUser(u); authErr = ''; login(u); window.CRM && window.CRM.pushAccounts(); return;
      }
      if (scriptUrl() && navigator.onLine) {
        try { const cu = await cloudRecover(name, code, p); authErr = ''; login(cu); return; }
        catch (e) { if (typeof e === 'string') throw e; }
      }
      throw 'Utilizatorul sau codul de recuperare nu se potrivesc.';
    } else if (f.id === 'fPw') {
      if (!(await checkPw(USER, $('#pw0').value))) { msgs.pw = 'Parola actuală nu e corectă.'; msgs.pwOk = false; render(); return; }
      const p = $('#pw1').value; if (p.length < 6) { msgs.pw = 'Parola nouă trebuie să aibă cel puțin 6 caractere.'; msgs.pwOk = false; render(); return; }
      USER.salt = newSalt(); USER.hash = await hashPw(p, USER.salt); updateUser(USER); msgs.pw = 'Parola a fost schimbată.'; msgs.pwOk = true; render(); window.CRM && window.CRM.pushAccounts();
    } else if (f.id === 'fNewUser') {
      try { const r = await createUser($('#nu-u').value, $('#nu-p').value);
        msgs.nu = `Contul <b>${esc(r.user.username)}</b> a fost creat. Cod de recuperare: <b style="font-family:ui-monospace,monospace;letter-spacing:.08em">${esc(r.code)}</b>. Notează-l: e singura cale de a schimba parola dacă e uitată. Rolul implicit e Utilizator; îl schimbi în lista de mai sus.`; if (window.CRM) { await window.CRM.pushAccounts(); window.CRM.reloadAccounts(); } }
      catch(err) { msgs.nu = `<span class="err-msg">${esc(err)}</span>`; }
      render();
    } else if (f.id === 'addForm') {
      const name = $('#ng-name').value.trim(), table = tableVal($('#ng-table').value);
      if (!name || table === '' || table === 0) return;
      W.draft.guests.push({ name, table }); saveW(); renderAdmin(); $('#ng-name').focus();
    } else if (f.id === 'fDel') {
      if (!(await checkPw(USER, $('#del-p').value))) { msgs.del = 'Parola nu e corectă.'; render(); return; }
      const id = USER.id; if (window.CRM) await window.CRM.deleteCloudAccount(id); W.draft = normCfg({}); W.published = null; await gc();
      LS.del(wsKey(id)); const acc = accounts(); acc.users = acc.users.filter(u => u.id !== id); LS.set(K_ACC, acc);
      logout();
    }
  } catch(err) {
    authErr = typeof err === 'string' ? err : 'Ceva n-a mers. Încearcă din nou.';
    const box = mode === 'auth' && $('#auth .err'); if (box) box.textContent = authErr; else if (mode === 'auth') renderAuth();
  }
});
